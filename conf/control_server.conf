lua_package_path '/usr/local/acccontrol/module/?.lua;;';
lua_package_cpath '/usr/local/acccontrol/module/?.so;;';

# 全局配置信息 未改动
lua_shared_dict access_config 1m;

# 限流访问次数记录、ip列表
lua_shared_dict access_number 10m;
lua_shared_dict access_number_iplist 5m;

# 黑名单
# key-value
lua_shared_dict iplist_black 10m;

# 白名单
lua_shared_dict iplist_white 10m;


# 限流/防扫描 ip(短时间、永久)
# value = 0 表示从限流规则中添加的 value = 1 表示从防扫描规则中添加
lua_shared_dict cc_access_number 10m;
lua_shared_dict cc_control_iplist 10m;

# ip属地字典 key / value
# [ip]_version / ver
# [ip]_continent_code / code
# [ip]_country_name / name
# [ip]_region_name / name
lua_shared_dict region_list 100m;

# 访问控制地区字典，存储格式 key / value
# continent_[continent_code] 0/1
# country_[country_name] 0/1
# region_[region_name] 0/1
lua_shared_dict access_region_list 1m;

# 规则库存储
lua_shared_dict signature_list 10m;

# 请求路径规则
lua_shared_dict path_rules_list 1m;

# 请求头规则
lua_shared_dict header_rules_list 1m;

# 请求参数规则
lua_shared_dict param_rules_list 1m;

# 日志缓冲区（引用计数 + 惰性删除）
lua_shared_dict log_buffer 50m;

init_by_lua_file /usr/local/acccontrol/luafiles/init_cache.lua;
init_worker_by_lua_file /usr/local/acccontrol/luafiles/log_syncer.lua;
resolver 8.8.8.8 114.114.114.114 ipv6=off;
server {
        listen       8042;

        root   /usr/local/acccontrol/;
        set $request_header '';
        access_by_lua_file /usr/local/acccontrol/luafiles/waf_auth.lua;

        location ~ \.js$ {
                root /usr/local/acccontrol/html;
                try_files $uri =404;
                add_header Cache-Control "no-cache"; # 强制协商缓存，避免浏览器启发式缓存旧脚本
                types { application/javascript js; }
        }
        location ~ \.css$ {
                root /usr/local/acccontrol/html;
                try_files $uri =404;
                add_header Cache-Control "no-cache";
                types { text/css css; }
        }

        location /data/ {
                root /usr/local/acccontrol/html;
                try_files $uri =404;
        }

        # 认证 API
        location /auth/login {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/auth_login.lua;
        }
        location /auth/setup {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/auth_setup.lua;
        }
        location /auth/logout {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/auth_logout.lua;
        }

        location /test {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/test.lua;
        }

        location = /login.html {
                root /usr/local/acccontrol/html;
                try_files /login.html =404;
                add_header Cache-Control "no-cache";
        }
        location = /setup.html {
                root /usr/local/acccontrol/html;
                try_files /setup.html =404;
                add_header Cache-Control "no-cache";
        }

        location / {
                try_files /html/index.html =404;
                add_header Cache-Control "no-cache";
                }
        location /getipmsg{
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/getipmsg.lua;
        }
        # 地区访问控制接口
        location /getaccesscontrol {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/getaccesscontrol.lua;
        }
        location /updateaccesscontrol {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/updateaccesscontrol.lua;
        }

        # 黑白名单ip列表接口
        location /getiplist {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/getiplist.lua;
        }
        location /updateiplist {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/updateiplist.lua;
        }
	location /ipdel {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/ipdel.lua;
        }

        # 限流配置文件
        location /getscanerconf {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/getscanerconf.lua;
        }
        # 限流策略配置（仅返回限流相关字段）
        location /getlimitscanconf {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/getlimitscanconf.lua;
        }
        # 防扫描策略配置（仅返回防扫描相关字段）
        location /getccscanconf {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/getccscanconf.lua;
        }
        location /updatescanerconf {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/updatescanerconf.lua;
        }

        # 限流封禁IP列表接口
        location /getblockediplist {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/getblockediplist.lua;
        }
        location /updateblockediplist {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/updateblockediplist.lua;
        }

        # 防扫描封禁IP列表接口
        location /getccblockediplist {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/getccblockediplist.lua;
        }
        location /updateccblockediplist {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/updateccblockediplist.lua;
        }

        # 请求路径规则接口
        location /getpathrules {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/getpathrules.lua;
        }
        location /updatepathrules {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/updatepathrules.lua;
        }

        # 请求参数规则接口
        location /getparamrules {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/getparamrules.lua;
        }
        location /updateparamrules {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/updateparamrules.lua;
        }

        # 请求头规则接口
        location /getheaderrules {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/getheaderrules.lua;
        }
        location /updateheaderrules {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/updateheaderrules.lua;
        }

        # 请求方法接口
        location /getmethodlist {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/getmethodlist.lua;
        }
        location /updatemethodlist {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/updatemethodlist.lua;
        }

        # HTTP 日志查询接口
        location /querylogs {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/querylogs.lua;
        }

        # 规则库（签名）管理接口
        location /getsignaturerules {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/getsignaturerules.lua;
        }
        location /updatesignaturerule {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/updatesignaturerule.lua;
        }
        location /addsignaturerule {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/addsignaturerule.lua;
        }
        location /deletesignaturerules {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/deletesignaturerules.lua;
        }

        # 中国访问热力图数据接口
        location /getchinavisits {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/getchinavisits.lua;
        }

        # 世界访问热力图数据接口
        location /getworldvisits {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/getworldvisits.lua;
        }

        # 服务器资源状态接口
        location /getserverstatus {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/getserverstatus.lua;
        }

        # 共享内存状态接口
        location /getdictinfo {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/getdictinfo.lua;
        }

        location /updateglobalconfig {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/updateglobalconfig.lua;
        }
        location /getglobalconfig {
                default_type application/json;
                content_by_lua_file /usr/local/acccontrol/luafiles/interface/getglobalconfig.lua;
        }

        error_page 400 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417      /error.html;
        error_page 500 501 502 503 504 505 506 507 508 509 510 511      /error.html;
        location = /error.html {
            return 489;
        }
    }
