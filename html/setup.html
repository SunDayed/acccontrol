<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>初始化账号 - WAF 控制台</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-page { display:flex; align-items:center; justify-content:center;
                 min-height:100vh; background:#f1f5f9; }
    .auth-card { width:380px; max-width:90vw; padding:2rem; background:#fff;
                 border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,0.1); }
    .auth-card h1 { text-align:center; margin:0 0 0.5rem;
                    font-size:1.25rem; color:#1e293b; }
    .auth-card .subtitle { text-align:center; margin:0 0 1.5rem;
                           font-size:0.85rem; color:#64748b; }
    .auth-card .form-group { margin-bottom:1rem; }
    .auth-card label { display:block; margin-bottom:0.375rem;
                       font-size:0.875rem; color:#475569; }
    .auth-card input { width:100%; padding:0.625rem 0.75rem; border:1px solid #cbd5e1;
                       border-radius:6px; font-size:0.9rem; box-sizing:border-box; }
    .auth-card input:focus { outline:none; border-color:#3b82f6;
                             box-shadow:0 0 0 3px rgba(59,130,246,0.15); }
    .auth-card .submit-btn { width:100%; padding:0.7rem; background:#16a34a;
                             color:#fff; border:none; border-radius:6px;
                             font-size:0.95rem; cursor:pointer; margin-top:0.5rem; }
    .auth-card .submit-btn:hover { background:#15803d; }
    .auth-card .submit-btn:disabled { opacity:0.6; cursor:not-allowed; }
    .auth-card .error-msg { color:#dc2626; font-size:0.85rem; text-align:center;
                            margin-top:0.75rem; display:none; }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>初始化管理员账号</h1>
    <p class="subtitle">首次使用，请设置管理员账号和密码</p>
    <div class="form-group">
      <label for="setup-username">用户名</label>
      <input id="setup-username" type="text" placeholder="请输入用户名" autofocus>
    </div>
    <div class="form-group">
      <label for="setup-password">密码</label>
      <input id="setup-password" type="password" placeholder="请输入密码（至少6位）">
    </div>
    <div class="form-group">
      <label for="setup-password2">确认密码</label>
      <input id="setup-password2" type="password" placeholder="请再次输入密码">
    </div>
    <button class="submit-btn" id="setup-submit">创建账号</button>
    <div class="error-msg" id="setup-error"></div>
  </div>
  <script>
    (function() {
      var btn = document.getElementById("setup-submit");
      var userInput = document.getElementById("setup-username");
      var passInput = document.getElementById("setup-password");
      var pass2Input = document.getElementById("setup-password2");
      var errEl = document.getElementById("setup-error");

      function showError(msg) {
        errEl.textContent = msg;
        errEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "创建账号";
      }

      function doSetup() {
        var user = userInput.value.trim();
        var pass = passInput.value;
        var pass2 = pass2Input.value;
        errEl.style.display = "none";

        if (!user || !pass) {
          showError("请输入用户名和密码");
          return;
        }

        if (pass.length < 6) {
          showError("密码长度不能少于6位");
          return;
        }

        if (pass !== pass2) {
          showError("两次输入的密码不一致");
          return;
        }

        btn.disabled = true;
        btn.textContent = "创建中...";

        fetch("/auth/setup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: user, password: pass })
        }).then(function(r) { return r.json(); }).then(function(d) {
          if (d.code === 0) {
            window.location.href = "/";
          } else {
            showError(d.message || "创建失败");
          }
        }).catch(function() {
          showError("网络错误，请重试");
        });
      }

      btn.addEventListener("click", doSetup);
      pass2Input.addEventListener("keydown", function(e) {
        if (e.key === "Enter") doSetup();
      });
      passInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter") doSetup();
      });
      userInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter") doSetup();
      });
    })();
  </script>
</body>
</html>
