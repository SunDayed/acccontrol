<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - WAF 控制台</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-page { display:flex; align-items:center; justify-content:center;
                 min-height:100vh; background:#f1f5f9; }
    .auth-card { width:380px; max-width:90vw; padding:2rem; background:#fff;
                 border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,0.1); }
    .auth-card h1 { text-align:center; margin:0 0 1.5rem;
                    font-size:1.25rem; color:#1e293b; }
    .auth-card .form-group { margin-bottom:1rem; }
    .auth-card label { display:block; margin-bottom:0.375rem;
                       font-size:0.875rem; color:#475569; }
    .auth-card input { width:100%; padding:0.625rem 0.75rem; border:1px solid #cbd5e1;
                       border-radius:6px; font-size:0.9rem; box-sizing:border-box; }
    .auth-card input:focus { outline:none; border-color:#3b82f6;
                             box-shadow:0 0 0 3px rgba(59,130,246,0.15); }
    .auth-card .submit-btn { width:100%; padding:0.7rem; background:#3b82f6;
                             color:#fff; border:none; border-radius:6px;
                             font-size:0.95rem; cursor:pointer; margin-top:0.5rem; }
    .auth-card .submit-btn:hover { background:#2563eb; }
    .auth-card .submit-btn:disabled { opacity:0.6; cursor:not-allowed; }
    .auth-card .error-msg { color:#dc2626; font-size:0.85rem; text-align:center;
                            margin-top:0.75rem; display:none; }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>WAF 控制台登录</h1>
    <div class="form-group">
      <label for="login-username">用户名</label>
      <input id="login-username" type="text" placeholder="请输入用户名" autofocus>
    </div>
    <div class="form-group">
      <label for="login-password">密码</label>
      <input id="login-password" type="password" placeholder="请输入密码">
    </div>
    <button class="submit-btn" id="login-submit">登 录</button>
    <div class="error-msg" id="login-error"></div>
  </div>
  <script>
    (function() {
      var btn = document.getElementById("login-submit");
      var userInput = document.getElementById("login-username");
      var passInput = document.getElementById("login-password");
      var errEl = document.getElementById("login-error");

      function showError(msg) {
        errEl.textContent = msg;
        errEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "登 录";
      }

      function doLogin() {
        var user = userInput.value.trim();
        var pass = passInput.value;
        errEl.style.display = "none";

        if (!user || !pass) {
          showError("请输入用户名和密码");
          return;
        }

        btn.disabled = true;
        btn.textContent = "登录中...";

        fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: user, password: pass })
        }).then(function(r) { return r.json(); }).then(function(d) {
          if (d.code === 0) {
            window.location.href = "/";
          } else {
            showError(d.message || "登录失败");
          }
        }).catch(function() {
          showError("网络错误，请重试");
        });
      }

      btn.addEventListener("click", doLogin);
      passInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter") doLogin();
      });
      userInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter") doLogin();
      });
    })();
  </script>
</body>
</html>
